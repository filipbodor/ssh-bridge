name: Test relay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t isaac-link-relay:local .
      - run: python3 -m unittest discover -s tests -v
  connector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Windows connector
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'windows\Connector.cs'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /out:IsaacLink.exe $source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Parse PowerShell installers
        shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
